// ─────────────────────────────────────────────────────────────────────────────
//  SNIPPET à coller dans `android/app/build.gradle` (projet Android généré
//  par `cap add android`) pour configurer la signature de release.
//
//  Emplacement du fichier cible : android/app/build.gradle
//  Où coller : dans le bloc `android { ... }` du module `app`.
//
//  La config lit `keystore.properties` (à la racine du projet). Voir
//  `keystore.properties.example` pour le modèle à remplir.
// ─────────────────────────────────────────────────────────────────────────────

import java.util.Properties
import java.io.FileInputStream

// Charger le fichier keystore.properties (s'il existe).
def keystorePropertiesFile = rootProject.file("../../keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    // ... (votre contenu existant)

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release   // <-- signature activée pour la release
        }
    }
}
